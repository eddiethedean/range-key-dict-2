name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with pytest
      run: |
        pytest tests/ -o addopts=--verbose

  coverage:
    name: Coverage report and Codecov
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=range_key_dict --cov-report=xml --cov-report=term-missing

    - name: Update coverage badge data
      run: |
        python3 <<'PY'
        import json
        import xml.etree.ElementTree as ET

        root = ET.parse("coverage.xml").getroot()
        pct = round(float(root.get("line-rate")) * 100)
        color = "brightgreen" if pct >= 90 else "yellow" if pct >= 80 else "red"
        payload = {
            "schemaVersion": 1,
            "label": "coverage",
            "message": f"{pct}%",
            "color": color,
        }
        with open("gh-badges/coverage.json", "w", encoding="utf-8") as f:
            json.dump(payload, f)
            f.write("\n")
        print(f"Coverage badge: {pct}% ({color})")
        PY

    # Optional: link repo on codecov.io; upload errors do not fail CI (see README).
    - name: Upload coverage to Codecov
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        files: coverage.xml
        slug: eddiethedean/range-key-dict-2
        flags: unittests
        fail_ci_if_error: false
        verbose: true
        use_oidc: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Commit coverage badge
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update coverage badge [skip ci]"
        file_pattern: gh-badges/coverage.json

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run ruff lint
      run: |
        ruff check range_key_dict tests

    - name: Run ruff format check
      run: |
        ruff format --check range_key_dict tests

    - name: Run black
      run: |
        black --check range_key_dict tests

    - name: Run isort
      run: |
        isort --check-only range_key_dict tests

    - name: Run mypy
      run: |
        mypy range_key_dict
